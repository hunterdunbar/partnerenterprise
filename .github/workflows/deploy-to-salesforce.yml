name: Salesforce CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Validate on Pull Requests (no deployment)
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authenticate to Sandbox
        run: |
          echo "${{ secrets.SF_USERNAME_SANDBOX }}"
          echo "${{ secrets.SF_JWT_KEY_SANDBOX }}" > server.key
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID_SANDBOX }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME_SANDBOX }} --instance-url ${{ secrets.SF_INSTANCE_URL_SANDBOX }} --set-default --alias sandbox
          rm server.key
      
      - name: Validate Deployment
        run: |
          sf project deploy validate --source-dir force-app/main/default --target-org sandbox --test-level RunLocalTests

  # Deploy to Production (main branch only)
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production  # Can add manual approval here
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authenticate to Production
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME }} --instance-url ${{ secrets.SF_INSTANCE_URL }} --set-default --alias production
          rm server.key
      
      - name: Deploy to Production
        run: |
          sf project deploy start --target-org production --wait 30 --test-level RunLocalTests

  # Deploy to Sandbox (develop, release, and hotfix branches)
  deploy-sandbox:
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authenticate to Sandbox
        run: |
          echo "${{ secrets.SF_JWT_KEY_SANDBOX }}" > server.key
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID_SANDBOX }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME_SANDBOX }} --instance-url ${{ secrets.SF_INSTANCE_URL_SANDBOX }} --set-default --alias sandbox
          rm server.key
      
      - name: Deploy to Sandbox
        run: |
          sf project deploy start --target-org sandbox --wait 30
      
      - name: Add deployment note
        run: |
          echo "Deployed branch: ${{ github.ref_name }}"